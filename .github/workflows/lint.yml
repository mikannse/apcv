name: Lint
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy pylint

      - name: Run Black
        run: black --check apcv tests

      - name: Run mypy
        run: mypy apcv --ignore-missing-imports

      - name: Run pylint
        run: pylint apcv --fail-under=7.0 || true
