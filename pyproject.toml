[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "apcv"
version = "0.1.0"
description = "Agent Policy Conformance Validator - Verify AI Agents comply with declared policies"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "typer>=0.9",
    "wrapt>=1.14",
    "docker>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=23.0",
    "mypy>=1.0",
    "pylint>=2.17",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]

[project.scripts]
apcv = "apcv.cli.main:app"

[tool.setuptools.packages.find]
include = ["apcv", "apcv.*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=apcv --cov-report=html --cov-report=term-missing -v"
