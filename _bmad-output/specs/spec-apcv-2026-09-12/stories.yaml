stories:
  - id: story-1
    title: "框架搭建与工具发现基础"
    epic: "第 1 周：核心基础设施"

    description: |
      建立项目脚手架，实现 LangGraph AST 解析器，并完成静态工具面发现。
      包含构建流水线、测试框架与基础工具注册表。

    spec_checkpoint: |
      完成 CAP-1（工具面发现——仅静态层）
      为 CAP-2、CAP-3、CAP-5 打下基础

    done_checkpoint: |
      ✅ GitHub 仓库初始化，并配置 CI/CD（GitHub Actions）
      ✅ 通过 AST 抽取 LangGraph @tool 装饰器（测试套件准确率 >95%）
      ✅ Tool SBOM JSON 输出格式已定义并通过测试
      ✅ 工具发现的单元测试（覆盖率 >80%）
      ✅ 暂不包含运行时能力检测（推迟到 story-3）

    invoke_dev_with: |
      - 搭建 monorepo 结构：/apcv/{core,cli,ui,tests,docs}
      - 基于 ast + tree-sitter 实现 ToolDiscovery.discover_static()
      - 创建测试夹具：5-10 个用于测试的 LangGraph 示例 agent
      - 集成测试：针对已知工具集校验 SBOM 准确率

    user_story: "作为一名 DevOps 工程师，我希望验证器能自动发现 LangGraph Agent 可调用的全部工具，以便我在制定策略之前先理解完整的能力面。"

    acceptance_criteria:
      - 工具发现能找出 LangGraph 代码中所有 @tool 装饰器
      - 输出为符合 schema 的合法 JSON
      - 对典型 Agent 代码的处理时间 <10 秒
      - 无误报（不得把未声明的工具标记为已发现）

    estimate_days: 3
    assignee: backend-team
    priority: critical

  - id: story-2
    title: "Policy DSL 与校验引擎"
    epic: "第 1 周：策略基础"

    description: |
      设计并实现 Policy DSL（YAML schema）、校验器与错误报告。
      让开发者能以标准格式声明 Agent 的约束。

    spec_checkpoint: |
      完成策略声明层（CAP-2 与 CAP-4 的输入）
      为所有下游故事启用策略驱动的校验

    done_checkpoint: |
      ✅ Policy YAML schema 已定义（tools、filesystem、network、parameters、rate_limits、privilege、compliance）
      ✅ Schema 校验器（基于 jsonschema 对照权威 schema 进行校验）
      ✅ 错误报告（针对策略违规给出友好提示）
      ✅ 策略示例：read-only、github-api、internal-admin 三类原型
      ✅ 单元测试：合法与非法策略（覆盖率 >80%）

    invoke_dev_with: |
      - 以 YAML 定义 schema（参考：policy-dsl-schema.md 配套文件）
      - 基于 jsonschema 库实现 PolicyValidator 类
      - 创建 3-5 个参考策略模板
      - 增加 IDE 集成提示（VS Code schema 支持、JSON schema 端点）

    user_story: "作为一名安全工程师，我希望以标准 YAML 格式声明 Agent 的策略约束，以便对策略进行版本管理并集成进 CI/CD。"

    acceptance_criteria:
      - 合法的策略 YAML 能无错误解析
      - 非法策略会给出清晰的错误信息
      - 同一策略可应用于多个 Agent
      - Schema 支持全部约束类型（tools、filesystem、network、privilege、rate limits）

    estimate_days: 2.5
    assignee: backend-team
    priority: critical

  - id: story-3
    title: "Probe 规则库与策略相对型生成"
    epic: "第 1-2 周：动态测试基础"

    description: |
      构建 20-30 条确定性探针规则，覆盖文件系统、工具调用、权限提升
      与网络访问类别。实现生成策略相对型测试用例的探针生成器。

    spec_checkpoint: |
      完成 CAP-2（策略相对型 Probe 生成）
      为 story-4 及之后的探针执行与一致性检查奠定基础

    done_checkpoint: |
      ✅ 实现 20-30 条探针规则（硬编码，非 LLM 生成）
      ✅ 探针生成器依据策略约束选择规则
      ✅ 策略相对型逻辑：探针随声明的策略边界自适应
      ✅ 探针 JSON 格式：id、category、description、test_command、expected_outcome
      ✅ 单元测试：针对多种策略类型验证探针生成（覆盖率 >80%）

    invoke_dev_with: |
      - 实现 ProbeLibrary 类，内置 20-30 条硬编码规则
      - 实现 ProbeGenerator：输入 Policy → 输出探针套件（≥15 个探针）
      - 策略相对型逻辑：策略声明"只读"则生成写入探针；策略禁止 bash 则生成 bash 探针
      - 针对参考策略进行测试（read-only、github-api、internal-admin）

    user_story: "作为安全团队，我希望验证器基于声明的策略自动生成越界测试，以便确认 Agent 确实遵守其声明的约束。"

    acceptance_criteria:
      - 对任意策略，探针生成耗时 <5 秒
      - 生成的探针与策略范围匹配（非平凡策略至少 15 个探针）
      - 每个探针都有明确的通过/失败语义
      - 探针库覆盖 filesystem、tool、privilege、network、rate-limit 类别

    estimate_days: 3
    assignee: backend-team + security-engineer
    priority: critical

  - id: story-4
    title: "隔离执行与参数追踪"
    epic: "第 2 周：动态验证"

    description: |
      实现基于 Docker 的探针执行器、wrapt 参数追踪与执行轨迹收集。
      在隔离、可复现的环境中运行探针并记录所有工具调用。

    spec_checkpoint: |
      完成 CAP-3（隔离的 Probe 执行与参数追踪）
      为 CAP-4 的一致性检查产出执行轨迹

    done_checkpoint: |
      ✅ Docker 镜像（apcv-probe），含基础 Agent 运行时
      ✅ IsolatedExecutor：启动 Docker 容器、注入探针、捕获结果
      ✅ wrapt 参数追踪：开销 <1%，捕获 100% 的工具调用
      ✅ 执行轨迹 JSONL 格式（timestamp、tool、args、result、policy_violation）
      ✅ 并行探针执行（4 个并发 worker，30 个探针总耗时 <60 秒）
      ✅ 容器生命周期测试：清理、隔离、无交叉污染

    invoke_dev_with: |
      - 构建 Docker 镜像：基础 Python 运行时 + LangGraph + wrapt
      - 实现 IsolatedExecutor：Docker API 客户端、run_probe()、execute_parallel()
      - 基于 wrapt 实现 @trace_parameters 装饰器
      - 集成测试：并行运行 30 个探针、校验轨迹、测量开销（<1%）

    user_story: "作为一名 DevOps 工程师，我希望探针在隔离环境中运行，从而在不影响生产系统的前提下安全地测试 Agent 边界。"

    acceptance_criteria:
      - 全部 20-30 个探针在 60 秒内执行完成（含容器启动）
      - 参数追踪记录 100% 的工具调用，开销 <1%
      - Docker 容器相互隔离（只读文件系统、无网络、干净状态）
      - 并发探针运行之间无交叉污染
      - 执行轨迹被正确收集并格式化

    estimate_days: 3
    assignee: backend-team + devops
    priority: critical

  - id: story-5
    title: "一致性检查与差异报告生成"
    epic: "第 2 周：判定与报告"

    description: |
      实现一致性检查器（比对 SBOM 与轨迹）、违规检测与策略校验规则。
      生成详细的差异报告与合规评分。

    spec_checkpoint: |
      完成 CAP-4（一致性检查与差异报告）
      产出 PASS/FAIL 判定与可供审计的违规细节

    done_checkpoint: |
      ✅ ConformanceChecker：比对 Tool SBOM 与执行轨迹
      ✅ 违规检测：未声明工具、参数违规、隐藏能力
      ✅ 合规评分算法（0-100，基于违规严重级别）
      ✅ 策略校验器：应用规则引擎，给出 PASS/FAIL/WARN
      ✅ 差异报告（JSON + Markdown）：违规项、修复提示、审计留痕
      ✅ 单元与集成测试：覆盖多种违规场景

    invoke_dev_with: |
      - 实现 ConformanceChecker 类
      - 实现违规检测逻辑（工具、参数、隐藏能力检查）
      - 实现 compliance_score 公式（如 100 - 10*num_violations）
      - 实现 DiffReport 类：输出 JSON + Markdown
      - 集成测试：已知违规场景（未声明工具、路径违规等）

    user_story: "作为一名安全工程师，我希望获得详细报告，精确指出 Agent 违反了哪些策略，以便指导开发者修正代码或恰当地更新策略。"

    acceptance_criteria:
      - 报告识别出所有违规（工具、参数、隐藏能力）
      - 合规评分清晰反映违规严重级别
      - 差异报告并排展示声明与实际
      - 报告包含修复建议
      - 输出格式：JSON（机器可读）、Markdown（人读）

    estimate_days: 3
    assignee: backend-team + security-engineer
    priority: critical

  - id: story-6
    title: "CLI 工具（apcv validate）"
    epic: "第 3 周：用户界面与 CI/CD 集成"

    description: |
      实现用于验证 Agent 的命令行界面。支持标准选项、
      输出格式（JSON、SARIF）与 CI/CD 流水线集成。

    spec_checkpoint: |
      完成 CAP-5（CLI 界面）
      支持在 CI/CD 流水线中的 DevOps 集成

    done_checkpoint: |
      ✅ CLI 命令：apcv validate --agent <path> --policy <yaml> --output {json,sarif,html}
      ✅ 退出码：0（PASS）、1（FAIL）、2（ERROR）
      ✅ 输出格式：JSON、SARIF、HTML
      ✅ 与 GitHub Actions、GitLab CI 的集成（有文档）
      ✅ 帮助文本、示例、错误处理
      ✅ CLI 测试：多种选项组合

    invoke_dev_with: |
      - 使用 Click 或 Typer 作为 CLI 框架
      - 实现 validate 命令（--agent、--policy、--output、--fail-on）
      - 实现输出格式化器（JSON、SARIF、HTML）
      - 编写 CI/CD 集成示例（GitHub Actions、GitLab CI）
      - CLI 测试：合法/非法参数、退出码、输出格式

    user_story: "作为一名 DevOps 工程师，我希望在 CI/CD 流水线中运行 apcv validate，让 Agent 验证成为部署流程中自动化的一环。"

    acceptance_criteria:
      - CLI 命令端到端可用
      - 支持全部必要选项
      - 退出码正确（0/1/2）
      - 输出格式正确且可解析
      - 文档包含 CI/CD 示例
      - 帮助文本清晰实用

    estimate_days: 2
    assignee: cli-team
    priority: high

  - id: story-7
    title: "Web UI（看板、策略编辑器、报告）"
    epic: "第 3 周：用户界面与可视化"

    description: |
      实现 Web 看板，展示 Agent 列表、合规评分、执行时间线、
      策略编辑器与报告生成。基于 React + FastAPI 构建。

    spec_checkpoint: |
      完成 CAP-5（Web UI 界面）
      完成 CAP-6（合规报告生成）
      支持安全团队的可视化与策略管理

    done_checkpoint: |
      ✅ Web 看板：带合规评分与趋势的 Agent 列表
      ✅ Agent 详情页：执行时间线、失败探针、建议
      ✅ 策略编辑器：带实时校验的 YAML 编辑器
      ✅ 报告生成器：PDF、JSON、HTML 导出
      ✅ 认证（MVP 可选）：本地用户或 OAuth
      ✅ 响应式设计（桌面 + 移动端）
      ✅ E2E 测试：覆盖关键用户旅程

    invoke_dev_with: |
      - 前端：React + TypeScript，样式用 TailwindCSS
      - 后端：FastAPI 端点，负责 Agent 数据、策略管理、报告生成
      - 实现看板页（Agent 列表、合规评分）
      - 实现 Agent 详情页（时间线、违规、建议）
      - 实现策略编辑器（YAML + 实时校验）
      - 实现报告中心（PDF/JSON/HTML 导出）
      - 使用 Playwright 编写 E2E 测试

    user_story: "作为安全团队负责人，我希望有一个展示所有 Agent 及其合规状态的看板，以便快速定位策略违规并管理 Agent 策略。"

    acceptance_criteria:
      - 看板展示带合规评分的 Agent 列表
      - Agent 详情页展示执行时间线与违规项
      - 策略编辑器可用并对输入进行校验
      - 报告可生成并下载
      - UI 具备响应式与无障碍支持
      - 关键用户旅程经过测试

    estimate_days: 3
    assignee: frontend-team + backend-team
    priority: high

  - id: story-8
    title: "E2E 演示与文档"
    epic: "第 3 周：演示与交付"

    description: |
      基于头脑风暴中的 GitHub 事件场景创建端到端演示。
      打包 MVP、文档与演示脚本用于交付。

    spec_checkpoint: |
      演示 7 项 capability 协同工作
      验证 MVP 达到交付就绪状态

    done_checkpoint: |
      ✅ 演示脚本：HuggingFace 事件启发的场景（带未声明工具的 Agent）
      ✅ 演示流程：静态发现 → 策略生成 → 探针执行 → FAIL 判定
      ✅ 用户文档：快速上手、CLI 用法、Web UI 走查
      ✅ 开发者文档：架构、API 设计、扩展点
      ✅ 部署指南：本地开发、Docker、Kubernetes（可选）
      ✅ GitHub README：项目介绍、快速上手、示例
      ✅ 演示已录制（视频走查可选）

    invoke_dev_with: |
      - 制作自包含演示：示例 Agent + 策略 + 预期结果
      - 按步骤记录演示场景
      - 编写用户文档：快速上手、策略示例、故障排查
      - 编写开发者文档：架构、如何扩展、贡献指南
      - 录制演示视频或制作交互式走查
      - 将全部材料打包到 /docs 目录

    user_story: "作为项目负责人，我希望有完整的端到端演示和清晰的文档，让干系人理解 APCV 做什么、如何使用。"

    acceptance_criteria:
      - 演示从头到尾成功运行
      - 文档覆盖用户与开发者工作流
      - README 清晰并包含快速上手
      - 提供示例策略
      - 全部材料达到可公开发布状态

    estimate_days: 2
    assignee: tech-writer + backend-team
    priority: high

  - id: story-9
    title: "包级工具面扫描（Package-Level Tool Surface Scanning）"
    epic: "Sprint 2: 多文件/包级发现"

    description: |
      ToolScanner 目前只扫描单个 Python 文件。真实企业 Agent 是一整个代码库
      （多文件、多模块），当前靠 enterprise-sim/pre-launch-gate/gate.py 这种外部
      薄集成来遍历包并合并 SBOM。本故事将包级扫描内建进 ToolScanner，替代该薄集成。

    spec_checkpoint: |
      补全 CAP-1（工具面发现）的"框架层包级发现"——多文件/多模块合并
      为 CAP-1 四层发现打地基

    done_checkpoint: |
      ✅ ToolScanner.scan() 支持传入包目录，递归扫描所有 .py 模块的 @tool
      ✅ 合并 SBOM 时每条工具记录来源文件（模块路径定位）
      ✅ 向后兼容：单文件扫描路径保持不变
      ✅ enterprise-sim/gate.py 改为直接调用内建包级扫描（删除薄集成逻辑）
      ✅ 单元 + 集成测试：多文件包、嵌套目录、跨模块工具去重

    invoke_dev_with: |
      - 扩展 ToolScanner.scan() 接受目录路径：walk 包内 .py，逐个 AST 解析
      - SBOM 的 Tool 增加 source_file 字段（来源模块定位）
      - 合并逻辑：跨模块 @tool 去重、同名冲突告警
      - 重构 enterprise-sim/gate.py，改为调用内建包级扫描
      - 测试：多文件包（含嵌套目录）、导入失败的模块降级处理

    user_story: "作为 DevOps 工程师，我希望 APCV 能直接扫描整个 Agent 代码库而非单个文件，以便对真实企业 Agent 做上线前验证，无需手写遍历脚本。"

    acceptance_criteria:
      - ToolScanner 能对包目录递归发现所有模块中的 @tool
      - 合并后的 SBOM 每条工具标注来源文件
      - 单文件扫描向后兼容，不破坏现有 CLI
      - gate.py 的薄集成被内建包级扫描取代
      - 多文件/嵌套目录/跨模块去重场景有测试覆盖

    estimate_days: 2
    assignee: backend-team
    priority: high

# ---------------------------------------------------------------------------
# 以下为供人类阅读的 Sprint 规划说明（原文 "---" 分隔之后的 Markdown 内容，
# 为保持整个文件可作为单一 YAML 文档解析，收纳进块标量，内容未删减）。
# ---------------------------------------------------------------------------
project_plan: |
  ## 故事映射与 Sprint 分配

  ### 第 1 周（第 1-5 天）
  - **story-1**（工具发现）：第 1-3 天
  - **story-2**（Policy DSL）：第 2-4 天
  - **story-3**（Probe 规则）：第 3-5 天

  **交付物**：Tool SBOM + Policy DSL + Probe 规则库（核心引擎主干）

  ### 第 2 周（第 6-10 天）
  - **story-3**（续）：第 6 天
  - **story-4**（隔离执行）：第 6-8 天
  - **story-5**（一致性与报告）：第 8-10 天

  **交付物**：完整 CLI 流水线（apcv validate 端到端）

  ### 第 3 周（第 11-15 天）
  - **story-6**（CLI 工具）：第 11-12 天
  - **story-7**（Web UI）：第 11-13 天
  - **story-8**（演示与文档）：第 14-15 天

  **交付物**：MVP 完成（CLI + Web UI + 演示 + 文档）

  ## 依赖与顺序

  ```
  story-1（工具发现）
    ↓
  story-2（Policy DSL）──────┐
    ↓                        ▼
  story-3（Probe 规则）◄── 策略输入
    ↓
  story-4（隔离执行）◄── 来自 story-3 的探针
    ↓
  story-5（一致性检查）◄── 来自 story-4 的执行轨迹
    ↓
  story-6（CLI 工具）────┐
    ├─────────────────────┤
  story-7（Web UI）──────┤（并行，均消费 story-5 的结果）
    ├─────────────────────┤
  story-8（演示与文档）◄─┘（依赖以上全部完成）
  ```

  **关键路径**：story-1 → story-2 → story-3 → story-4 → story-5（10 天）
  **并行轨道**：story-6 + story-7（3 天，在 story-5 之后启动）
  **收尾**：story-8（2 天）
  **总计**：约 15 天（含缓冲共 3 周）

  ## 风险与调整

  若出现延期：
  - **最小 MVP**：story-1 + story-2 + story-3 + story-4 + story-5 + story-6（仅 CLI，不含 Web UI）
  - **必要时可舍弃**：Web UI（story-7）可延至 Sprint 2；CLI 对 CI/CD 落地至关重要
  - **尽可能保留**：演示（story-8）对验证与交付至关重要

design_drift: |
  ## 设计变更注记（2026-09-13 校准）

  对照代码实际状态，以下计划中的 AC 因设计修正与实现取舍发生偏离，
  记录于此以避免"文档与代码脱节"：

  1. **story-3（探针规则）**: 原 AC 要求 20-30 条探针。经重构收敛为 7 条 agent 探针
     （tool 4 + rate_limit 3）。shell 探针（filesystem/network/privilege 共 20 条）因
     "沙箱是隔离笼子、不做策略执行"被移除；悬空探针（tool_import/dynamic/override）
     因语义不清被移除。探针数量低于原门槛，属有意取舍。

  2. **story-4（隔离执行）**: 原 AC 要求"只读文件系统、禁用网络"。沙箱定位修正为
     "固定隔离笼子（非 root + 无网络），不按策略执行"。denied_paths/read-only 等
     限制归部署平台，不由沙箱执行——否则会预先拦截越界行为、摧毁检测能力。

  3. **story-5（一致性检查）**: 原 AC 要求 "JSON + Markdown" 双格式报告及每条违规的
     修复提示。当前仅 JSON，Markdown 与修复提示未实现。

  4. **story-7（Web UI）**: 未开始，backend 为硬编码假数据。用户明确延后。

  5. **story-1（工具发现）**: 原 CAP-1 要求"四层发现"。仅实现框架层单文件 AST 扫描；
     多文件包级扫描靠 enterprise-sim/gate.py 薄集成。

